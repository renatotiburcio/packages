name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6 AM

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore

    - name: Install Playwright browsers
      run: |
        cd tests/XForge.DesignSystem.E2E
        dotnet build
        pwsh bin/Debug/net10.0/playwright.ps1 install --with-deps

    - name: Run E2E tests
      run: |
        cd tests/XForge.DesignSystem.E2E
        dotnet test --logger "trx;LogFileName=e2e-results.trx"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-results
        path: tests/XForge.DesignSystem.E2E/TestResults/

    - name: Generate coverage report
      if: always()
      run: |
        dotnet tool install --global dotnet-reportgenerator-globaltool
        reportgenerator "-reports:tests/XForge.DesignSystem.E2E/TestResults/*.trx" "-targetdir:coverage" "-reporttypes:HtmlInline_AzurePipelines"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: coverage/
