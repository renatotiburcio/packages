name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build & test XForge.Mediator
        run: |
          dotnet build XForge.Mediator/XForge.Mediator.sln -c Release
          dotnet test XForge.Mediator/XForge.Mediator.sln -c Release --no-build

      - name: Build & test XForge.Mapper
        run: |
          dotnet build XForge.Mapper/XForge.Mapper.sln -c Release
          dotnet test XForge.Mapper/XForge.Mapper.sln -c Release --no-build

      - name: Build & test XForge.Mapper.SourceGenerator
        run: |
          dotnet build XForge.Mapper.SourceGenerator/XForge.Mapper.SourceGenerator.sln -c Release
          dotnet test XForge.Mapper.SourceGenerator/XForge.Mapper.SourceGenerator.sln -c Release --no-build

      - name: Build & test XForge.Mediator.SourceGenerator
        run: |
          dotnet build XForge.Mediator.SourceGenerator/XForge.Mediator.SourceGenerator.sln -c Release
          dotnet test XForge.Mediator.SourceGenerator/XForge.Mediator.SourceGenerator.sln -c Release --no-build

      - name: Build & test XForge.Mapper.Projections
        run: |
          dotnet build XForge.Mapper.Projections/XForge.Mapper.Projections.sln -c Release
          dotnet test XForge.Mapper.Projections/XForge.Mapper.Projections.sln -c Release --no-build

      - name: Build & test XForge.Validation
        run: |
          dotnet build XForge.Validation/XForge.Validation.sln -c Release
          dotnet test XForge.Validation/XForge.Validation.sln -c Release --no-build

      - name: Build & test XForge.Validation.TestHelper
        run: |
          dotnet build XForge.Validation.TestHelper/XForge.Validation.TestHelper.sln -c Release
          dotnet test XForge.Validation.TestHelper/XForge.Validation.TestHelper.sln -c Release --no-build

      - name: Build & test sample CleanArchitecture
        run: |
          dotnet build samples/CleanArchitecture/CleanArchitecture.sln -c Release
          dotnet test samples/CleanArchitecture/CleanArchitecture.sln -c Release --no-build

      - name: Build XForge.DesignSystem (core)
        run: |
          dotnet build XForge.DesignSystem/src/XForge.DesignSystem/XForge.DesignSystem.csproj -c Release
          dotnet build XForge.DesignSystem/src/XForge.DesignSystem.Tests/XForge.DesignSystem.Tests.csproj -c Release

      # Suite bUnit completa e longa (488 arquivos) — job dedicado com timeout folgado
      - name: Test XForge.DesignSystem (nucleo)
        timeout-minutes: 40
        run: |
          dotnet test XForge.DesignSystem/src/XForge.DesignSystem.Tests/XForge.DesignSystem.Tests.csproj -c Release --no-build --logger "console;verbosity=minimal"

      - name: Build & test XForge.Mediator.Behaviors
        run: |
          dotnet build XForge.Mediator.Behaviors/XForge.Mediator.Behaviors.sln -c Release
          dotnet test XForge.Mediator.Behaviors/XForge.Mediator.Behaviors.sln -c Release --no-build

      - name: Pack
        run: |
          dotnet pack XForge.Mediator/src/XForge.Mediator/XForge.Mediator.csproj -c Release -o artifacts/mediator
          dotnet pack XForge.Mapper/src/XForge.Mapper/XForge.Mapper.csproj -c Release -o artifacts/mapper
          dotnet pack XForge.Mapper.Projections/src/XForge.Mapper.Projections/XForge.Mapper.Projections.csproj -c Release -o artifacts/mapper-projections
          dotnet pack XForge.Validation/src/XForge.Validation/XForge.Validation.csproj -c Release -o artifacts/validation
          dotnet pack XForge.Mediator.Behaviors/src/XForge.Mediator.Behaviors/XForge.Mediator.Behaviors.csproj -c Release -o artifacts/mediator-behaviors

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/**/*.nupkg
          retention-days: 14
